schema = 1
# Uses the neutral N16R8 PlatformIO board without inheriting DevKit pin headers.
[board]
id = "m5paper_mono"
name = "M5Stack PaperMono"
vendor = "M5Stack"
module = "ESP32-S3R8 (16 MB flash / 8 MB OPI PSRAM)"
[target]
mcu = "esp32s3"
platformio_board = "esp32-s3-devkitc1-n16r8"
[build]
drivers = ["cdc_usb_serial_jtag", "uart_esp_idf", "i2c_esp_idf", "spi_esp_idf", "gpio_esp_idf", "display_ssd1677", "pointer_ft6336", "storage_expansion", "battery_expansion", "rtc_rx8130ce"]
capabilities = ["psram", "sd", "simd", "gfx", "display", "pointer", "cdc", "uart", "i2c", "spi", "gpio", "wifi", "ble", "key", "buttons", "expansion_gpio", "expansion_i2c", "expansion_spi", "battery", "rtc", "status_led"]
required_packages = ["driver_rx8130ce"]
psram_bytes = 8388608
[header]
includes = ["solar_os_buttons.h", "solar_os_keys.h"]
[defines]
SOLAR_OS_BOARD_STORAGE_PRIMARY_FLASH = "1"
SOLAR_OS_BOARD_LAUNCHER_TOUCH_GRID = "1"
SOLAR_OS_BOARD_SKETCH_POINTER_DEVICE = '"touch0"'
SOLAR_OS_BOARD_SKETCH_ASYNC_PRESENT = "1"
SOLAR_OS_BOARD_WRITER_DEFAULT_ZOOM = "4"
SOLAR_OS_BOARD_UI_FONT_PRESET = "SOLAR_OS_UI_FONT_PRESET_LARGE"
SOLAR_OS_BOARD_UI_SCALE_PERCENT = "140"
SOLAR_OS_BOARD_TERMINAL_STATUS_REFRESH_ON_CHANGE = "0"
SOLAR_OS_BOARD_DISPLAY_CONTROLLER = '"SSD1677"'
SOLAR_OS_BOARD_DISPLAY_WIDTH = "480"
SOLAR_OS_BOARD_DISPLAY_HEIGHT = "800"
SOLAR_OS_BOARD_DISPLAY_NATIVE_WIDTH = "800"
SOLAR_OS_BOARD_DISPLAY_NATIVE_HEIGHT = "480"
SOLAR_OS_BOARD_DISPLAY_U8G2_ROTATION = "U8G2_R3"
# Landscape 800x480, USB-C on the left short edge near its upper end.
# Case reference: rotate the official front-view portrait clockwise by 90 deg.
# Keep touch in portrait coordinates: SolarOS rotates targeted pointer events.
SOLAR_OS_BOARD_DISPLAY_DEFAULT_ORIENTATION = "270"
SOLAR_OS_BOARD_I2C_PORT = "I2C_NUM_0"
SOLAR_OS_BOARD_PIN_I2C_SDA = "GPIO_NUM_47"
SOLAR_OS_BOARD_PIN_I2C_SCL = "GPIO_NUM_48"
# The always-powered PM1/IOE/RTC bus must not see GPIO isolation during sleep.
SOLAR_OS_BOARD_I2C_KEEP_PINS_IN_LIGHT_SLEEP = "1"
SOLAR_OS_BOARD_UART_PORT = "UART_NUM_0"
SOLAR_OS_BOARD_PIN_UART_TX = "GPIO_NUM_43"
SOLAR_OS_BOARD_PIN_UART_RX = "GPIO_NUM_44"
# KEY1 uses the standard system KEY path (power action / BLE pairing).
# Do not also register GPIO2 as a generic button or override short-press input.
SOLAR_OS_BOARD_PIN_KEY = "GPIO_NUM_2"
SOLAR_OS_BOARD_KEY_ACTIVE_LEVEL = "0"
SOLAR_OS_BOARD_KEY_PULL_UP = "1"
SOLAR_OS_BOARD_KEY_PULL_DOWN = "0"
# KEY2 / Button B: release before 1.2 s = Enter; release after = Esc.
SOLAR_OS_BOARD_BUTTONS = '{{.pin = GPIO_NUM_3, .name = "KEY2", .key = SOLAR_OS_KEY_ENTER, .active_low = true, .emit_on_release = true, .long_press_key = SOLAR_OS_KEY_ESCAPE, .long_press_ms = 1200U, .pull = SOLAR_OS_BUTTON_PULL_UP}}'
# E-paper updates remain blocking even with OTP fast; keep idle blink disabled.
SOLAR_OS_BOARD_WRITER_CURSOR_BLINK = "0"
[runtime]
spi_hosts = []
uart_ports = []
i2s_ports = []
[[buses]]
name = "i2c0"
protocol = "i2c"
sharing = "shared"
port = "I2C_NUM_0"
sda = 47
scl = 48
speed_hz = 100000
[[buses]]
name = "spi0"
protocol = "spi"
sharing = "shared"
host = "SPI2_HOST"
sclk = 15
mosi = 14
cs = [16]
max_transfer_size = 4096
[[buses]]
name = "uart0"
protocol = "uart"
sharing = "exclusive"
port = "UART_NUM_0"
tx = 43
rx = 44
baud_rate = 115200
# Fixed device order: power provider must register before its consumers.
[[devices]]
driver = "m5papermono-power"
name = "ioe0"
bindings = { i2c = "i2c0", addr = 0x4f, pm_addr = 0x6e }
[[devices]]
driver = "ssd1677"
name = "display0"
bindings = { spi = "spi0", cs = 16, dc = 17, reset = "ioe0:4", busy = 18, power = "ioe0:2", rotation = 3, panel = 1, clock = 10000 }
[[devices]]
driver = "ft6336"
name = "touch0"
bindings = { i2c = "i2c0", addr = 0x38, reset = "ioe0:5", power = "ioe0:12", irq = 4, rotation = 0, enabled = 0, managed_power = 1 }
[[devices]]
driver = "rx8130ce"
name = "rtc0"
bindings = { i2c = "i2c0", addr = 0x32 }

[[devices]]
driver = "sdmmc"
name = "storage0"
bindings = { clk = 13, cmd = 12, d0 = 11, d1 = 10, d2 = 9, d3 = 8, power_line = "ioe0:13", detect = "ioe0:0", active = 1 }

[[pins]]
gpio = 0
policy = "fixed"
role = "PM1 BOOT_OUT"

[[pins]]
gpio = 1
policy = "fixed"
role = "PM1 IRQ"

[[pins]]
gpio = 2
policy = "fixed"
role = "KEY1 / system KEY"

